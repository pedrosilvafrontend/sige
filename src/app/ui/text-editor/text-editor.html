<div class="NgxEditor__Wrapper">
  @if (!disabled()) {
    <ngx-editor-menu [editor]="editor" [toolbar]="toolbar"> </ngx-editor-menu>
  }
  <ngx-editor
    [editor]="editor"
    [formControl]="control"
    [placeholder]="''"
    [disabled]="disabled()"
    (blur)="handleBlur()"
  ></ngx-editor>
</div>
