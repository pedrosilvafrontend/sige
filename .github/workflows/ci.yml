name: CI

on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: "Build and Push"
    runs-on: ubuntu-latest
#    strategy:
#      matrix:
#        node: [ 18, 20, 24 ]

    steps:
      - uses: actions/checkout@v6.0.2

#      - name: Setup node | ${{ matrix.node }}
      - name: Setup node
        uses: actions/setup-node@v6.3.0
        with:
          # node-version: ${{ matrix.node }}
          node-version: 24
          cache: 'npm'
      - run: npm i
#      - run: npm run test

      - name: Generate tag
        id: generate_tag
        run: |
          SHA=$(echo "$GITHUB_SHA" | head -c 7)
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Configure AWD credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
#          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
#          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: arn:aws:iam::137140610965:role/ecr-role
          aws-region: us-east-2
#          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
#          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build docker image
        id: build-image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ steps.generate_tag.outputs.sha }}
        run: |
          docker build -t $REGISTRY/tride-ci:$TAG .
          docker push $REGISTRY/tride-ci:$TAG
          IMAGE=$(echo $REGISTRY/tride-ci:$TAG)
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Deploy to App Runner
        uses: awslabs/amazon-app-runner-deploy@main
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        with:
          service: sige-app
          image: ${{ steps.build-image.outputs.image }}
          access-role-arn: arn:aws:iam::137140610965:role/app-runner-role
          region: us-east-2
          cpu: 1
          memory: 2
          port: 80
          copy-env-vars: |
            BACKEND_URL
#
#      - name: Push image
#        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/sige-frontend:${{ steps.generate_tag.outputs.sha }}
