<div class="row event-checkbox-group pt-2 pb-5">
  <ui-skeleton type="card" [loading]="isLoading()" class="col-md-4"></ui-skeleton>
  <ui-skeleton type="card" [loading]="isLoading()" class="col-md-4"></ui-skeleton>
  <ui-skeleton type="card" [loading]="isLoading()" class="col-md-4"></ui-skeleton>
  @for (event of events; let i = $index; track i) {
    <div class="col-md-4 mb-3">
      <ui-skeleton type="card" [loading]="isLoading()">
        <mat-checkbox
          [checked]="event.selected"
          [disabled]="event.disabled || disabled()"
          (change)="toggle($event.checked, i)">
          <ui-event-card [color]="event.color || ''" [auth]="auth" [event]="event" [activities]="activities"></ui-event-card>
        </mat-checkbox>
      </ui-skeleton>
    </div>
  }
</div>
