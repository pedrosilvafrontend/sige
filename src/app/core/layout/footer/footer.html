<div class="footer">
  <div class="d-flex align-content-between">
    <div class="w-100"></div>
    <div class="text-right">
      @let data = (this.data$ | async);
      @if (data) {
        <span [title]="data.version+' - '+(data.builtAt | date: 'dd/MM/yyyy HH:mm:ss')">
          {{ data.version }}
        </span>
      }
    </div>
  </div>
</div>
