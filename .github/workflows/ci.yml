name: CI

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  build:
    name: "Build and Push"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Setup node
        uses: actions/setup-node@v6.3.0
        with:
          node-version: 24
          cache: 'npm'
      - run: npm i
#      - run: npm run test

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Generate tag
        id: generate_tag
        run: |
          SHA=$(echo "$GITHUB_SHA" | head -c 7)
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ECR_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build docker image
        id: build-image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ steps.generate_tag.outputs.sha }}
        run: |
          docker build -t $REGISTRY/sige-frontend:$TAG .
          docker tag $REGISTRY/sige-frontend:$TAG $REGISTRY/sige-frontend:latest
          docker push --all-tags $REGISTRY/sige-frontend
          IMAGE=$(echo $REGISTRY/sige-frontend:$TAG)
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Deploy to App Runner
        id: deploy-app-runner
        uses: awslabs/amazon-app-runner-deploy@main
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        with:
          service: ${{ vars.SERVICE_NAME }}
          image: ${{ steps.build-image.outputs.image }}
          access-role-arn: ${{ secrets.AWS_APP_RUNNER_ROLE }}
          region: ${{ secrets.AWS_REGION }}
          cpu: 1
          memory: 2
          port: 80
          wait-for-service-stability-seconds: 300
          copy-env-vars: |
            BACKEND_URL

      - name: App Runner check
        run: echo "App Runner running at ${{ steps.deploy-app-runner.outputs.service-url }}"
