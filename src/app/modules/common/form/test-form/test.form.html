@let multiclassTest = form.controls.type.getRawValue() === 'MULTICLASS_TEST';
<div class="row" [formGroup]="form">
<!--  @if (isManager) {-->
    <div class="col-md-6">
      <mat-form-field class="mat-mdc-form-field"  appearance="outline" subscriptSizing="dynamic">
        <mat-label>{{ 'Type' | translate }}</mat-label>
        <mat-select formControlName="type" [compareWith]="compare" [disabled]="!isManager || isMulticlass || !!form.value.id">
          @for (item of proofTypes; track item) {
            <mat-option [value]="item">
              {{ item | translate }}
            </mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>

    @if (multiclassTest) {
      <div class="col-sm-6">
        <app-curricular-component-select
          [formControl]="ccControl"
          [classYearId]="classYearId"
          [disabled]="!isManager"
        ></app-curricular-component-select>
      </div>
      <div class="col-md-12">
        <app-event-checkbox-group [form]="form.controls.events" [events]="events" [selectAll]="true" [disabled]="!isManager"></app-event-checkbox-group>
      </div>
    }
<!--  }-->

  <div class="col-md-12">
    <ui-field
      id="title"
      name="title"
      [label]="'Title' | translate"
      formControlName="title"
    >
    </ui-field>
  </div>
  <div class="col-md-6">
    <ui-field
      id="score"
      name="score"
      cType="score"
      [label]="'Score' | translate"
      [required]="!isManager || !multiclassTest"
      formControlName="score"
    >
    </ui-field>
  </div>
  <div class="col-md-12">
    <ui-textarea
      id="content"
      name="content"
      [label]="'Content' | translate"
      [required]="!isManager || !multiclassTest"
      formControlName="content"
      ></ui-textarea>
  </div>
  <div class="col-md-12">
    <ui-textarea
      id="whereToFindIt"
      name="whereToFindIt"
      [label]="'Where to find it' | translate"
      formControlName="whereToFindIt"
    >
    </ui-textarea>
  </div>
</div>
